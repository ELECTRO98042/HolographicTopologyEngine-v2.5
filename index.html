<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Holographic Topology Engine v2.5</title>
    <style>
        body {
            margin: 0;
            background-color: #060810;
            color: #38bdf8;
            font-family: monospace;
            overflow: hidden;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(6, 8, 16, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 12px 18px;
            border-radius: 6px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="hud">
        TOPOLOGY ENGINE v2.5 | NODES: <span id="node-count">0</span> | FPS: <span id="fps">60</span>
    </div>

    <canvas id="simCanvas"></canvas>

    <script>
        // === [BLOCK: MODULE_STATE] ===
        const SimulationState = {
            version: "2.5.0",
            fps: 60,
            camera: {
                rotX: 0.3,
                rotY: 0.4,
                baseScale: 180,
                isPanning: false,
                lastMouseX: 0,
                lastMouseY: 0
            },
            params: {
                curvatureK: 0.0,
                driftSpeed: 0.2,
                maxBoundaryRadius: 4.2
            },
            nodes: [],
            bonds: [],
            interaction: {
                selectedNode: null,
                dragStartNode: null,
                isShiftDragging: false
            }
        };

        // === [BLOCK: MODULE_MATHEMATICS_PROJECTION] ===
        function project3D(x, y, z) {
            const radX = SimulationState.camera.rotX;
            const radY = SimulationState.camera.rotY;

            const cosY = Math.cos(radY), sinY = Math.sin(radY);
            const x1 = x * cosY - z * sinY;
            const z1 = x * sinY + z * cosY;

            const cosX = Math.cos(radX), sinX = Math.sin(radX);
            const y2 = y * cosX - z1 * sinX;
            const z2 = y * sinX + z1 * cosX;

            const distance = 8.0;
            const focalLength = SimulationState.camera.baseScale;
            const scale = focalLength / (distance + z2);

            return {
                px: canvas.width / 2 + x1 * scale,
                py: canvas.height / 2 + y2 * scale,
                scale: scale,
                depth: z2
            };
        }

        function unproject3D(screenX, screenY, targetZ = 0) {
            const distance = 8.0;
            const focalLength = SimulationState.camera.baseScale;
            const scale = focalLength / (distance + targetZ);

            const x1 = (screenX - canvas.width / 2) / scale;
            const y2 = (screenY - canvas.height / 2) / scale;

            const radX = SimulationState.camera.rotX;
            const radY = SimulationState.camera.rotY;

            const cosX = Math.cos(-radX), sinX = Math.sin(-radX);
            const y1 = y2 * cosX - targetZ * sinX;
            const z1 = y2 * sinX + targetZ * cosX;

            const cosY = Math.cos(-radY), sinY = Math.sin(-radY);
            const x = x1 * cosY - z1 * sinY;
            const z = x1 * sinY + z1 * cosY;

            return { x, y: y1, z };
        }

        // === [BLOCK: MODULE_PHYSICS_MANIFOLD] ===
        function createNode(x, y, z) {
            return {
                x: x, y: y, z: z,
                baseRadius: 3, // Drastically reduced base size
                vx: (Math.random() - 0.5) * 0.02,
                vy: (Math.random() - 0.5) * 0.02,
                vz: (Math.random() - 0.5) * 0.02,
                update: function(kCurvature, driftSpeed) {
                    const distFromOrigin = Math.hypot(this.x, this.y, this.z) || 1;
                    if (kCurvature !== 0) {
                        const pullFactor = (kCurvature * 0.015) / (distFromOrigin * 0.05);
                        this.vx -= (this.x / distFromOrigin) * pullFactor;
                        this.vy -= (this.y / distFromOrigin) * pullFactor;
                        this.vz -= (this.z / distFromOrigin) * pullFactor;
                    }
                    
                    this.x += this.vx * driftSpeed;
                    this.y += this.vy * driftSpeed;
                    this.z += this.vz * driftSpeed;

                    const maxR = SimulationState.params.maxBoundaryRadius;
                    if (distFromOrigin > maxR) {
                        this.x = (this.x / distFromOrigin) * maxR;
                        this.y = (this.y / distFromOrigin) * maxR;
                        this.z = (this.z / distFromOrigin) * maxR;
                        this.vx *= -0.4;
                        this.vy *= -0.4;
                        this.vz *= -0.4;
                    }
                }
            };
        }

        // === [BLOCK: INITIALIZATION] ===
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for(let i=0; i<15; i++) {
            SimulationState.nodes.push(createNode(
                (Math.random() - 0.5) * 3,
                (Math.random() - 0.5) * 3,
                (Math.random() - 0.5) * 3
            ));
        }

        // === [BLOCK: MODULE_INPUT_INTERACTION] ===
        let isMouseDown = false;
        let hasDragged = false;

        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            hasDragged = false;
            SimulationState.camera.lastMouseX = e.clientX;
            SimulationState.camera.lastMouseY = e.clientY;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            let clickedNode = null;
            SimulationState.nodes.forEach(node => {
                const proj = project3D(node.x, node.y, node.z);
                const r = Math.max(2, node.baseRadius * proj.scale * 0.05);
                if (Math.hypot(mouseX - proj.px, mouseY - proj.py) < r + 4) {
                    clickedNode = node;
                }
            });

            if (clickedNode && e.shiftKey) {
                SimulationState.interaction.dragStartNode = clickedNode;
                SimulationState.interaction.isShiftDragging = true;
            } else {
                SimulationState.interaction.selectedNode = clickedNode;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            const dx = e.clientX - SimulationState.camera.lastMouseX;
            const dy = e.clientY - SimulationState.camera.lastMouseY;

            if (Math.hypot(dx, dy) > 2) {
                hasDragged = true;
            }

            if (SimulationState.interaction.isShiftDragging) return;

            if (hasDragged && !SimulationState.interaction.selectedNode) {
                SimulationState.camera.rotY += dx * 0.005;
                SimulationState.camera.rotX += dy * 0.005;
            }

            SimulationState.camera.lastMouseX = e.clientX;
            SimulationState.camera.lastMouseY = e.clientY;
        });

        window.addEventListener('mouseup', (e) => {
            if (!hasDragged && !SimulationState.interaction.selectedNode && !SimulationState.interaction.isShiftDragging) {
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;

                const worldPos = unproject3D(clickX, clickY, 0);
                SimulationState.nodes.push(createNode(worldPos.x, worldPos.y, worldPos.z));
            }

            if (SimulationState.interaction.isShiftDragging && SimulationState.interaction.dragStartNode) {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                let targetNode = null;
                SimulationState.nodes.forEach(node => {
                    const proj = project3D(node.x, node.y, node.z);
                    const r = Math.max(2, node.baseRadius * proj.scale * 0.05);
                    if (Math.hypot(mouseX - proj.px, mouseY - proj.py) < r + 4) {
                        targetNode = node;
                    }
                });

                if (targetNode && targetNode !== SimulationState.interaction.dragStartNode) {
                    SimulationState.bonds.push({
                        from: SimulationState.interaction.dragStartNode,
                        to: targetNode
                    });
                }
            }

            isMouseDown = false;
            SimulationState.interaction.isShiftDragging = false;
            SimulationState.interaction.dragStartNode = null;
        });

        // === [BLOCK: RENDER_LOOP] ===
        let lastTime = performance.now();
        function mainLoop(time) {
            const dt = (time - lastTime) / 1000;
            lastTime = time;
            SimulationState.fps = Math.round(1 / (dt || 0.016));
            document.getElementById('fps').innerText = SimulationState.fps;
            document.getElementById('node-count').innerText = SimulationState.nodes.length;

            ctx.fillStyle = '#060810';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Bonds
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
            ctx.lineWidth = 1;
            SimulationState.bonds.forEach(b => {
                const p1 = project3D(b.from.x, b.from.y, b.from.z);
                const p2 = project3D(b.to.x, b.to.y, b.to.z);
                ctx.beginPath();
                ctx.moveTo(p1.px, p1.py);
                ctx.lineTo(p2.px, p2.py);
                ctx.stroke();
            });

            // Update & Render Nodes
            const k = SimulationState.params.curvatureK;
            const drift = SimulationState.params.driftSpeed;

            SimulationState.nodes.forEach(node => {
                node.update(k, drift);
                const proj = project3D(node.x, node.y, node.z);

                ctx.beginPath();
                // Apply a strict multiplier (0.05) to keep nodes small and distinct
                ctx.arc(proj.px, proj.py, Math.max(2, node.baseRadius * proj.scale * 0.05), 0, Math.PI * 2);
                ctx.fillStyle = '#38bdf8';
                ctx.fill();
            });

            requestAnimationFrame(mainLoop);
        }
        requestAnimationFrame(mainLoop);
    </script>
</body>
</html>
