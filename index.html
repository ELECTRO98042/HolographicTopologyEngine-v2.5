<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Holographic Topology Engine v2.5</title>
    <style>
        body {
            margin: 0;
            background-color: #060810;
            color: #38bdf8;
            font-family: monospace;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(6, 8, 16, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 12px 18px;
            border-radius: 6px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="hud">
        TOPOLOGY ENGINE v2.5 | NODES: <span id="node-count">0</span> | FPS: <span id="fps">60</span>
    </div>

    <canvas id="simCanvas"></canvas>

    <script>
        // === [BLOCK: MODULE_STATE] ===
        const SimulationState = {
            version: "2.5.0",
            fps: 60,
            camera: {
                rotX: 0.3,
                rotY: 0.4,
                baseScale: 180
            },
            params: {
                curvatureK: 0.0,
                driftSpeed: 0.5,
                maxBoundaryRadius: 4.2
            },
            nodes: [],
            bonds: []
        };

        // === [BLOCK: INITIALIZATION] ===
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // === [BLOCK: RENDER_LOOP] ===
        let lastTime = performance.now();
        function mainLoop(time) {
            const dt = (time - lastTime) / 1000;
            lastTime = time;
            SimulationState.fps = Math.round(1 / (dt || 0.016));
            document.getElementById('fps').innerText = SimulationState.fps;
            document.getElementById('node-count').innerText = SimulationState.nodes.length;

            // Clear frame
            ctx.fillStyle = '#060810';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            requestAnimationFrame(mainLoop);
        }
        requestAnimationFrame(mainLoop);
    </script>
</body>
</html>
