<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic HUD - CH-03 Raw Matrix Inspector</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #050808;
            overflow: hidden;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }
    </style>
    <!-- Core Engine & Viewer Scripts -->
    <script type="module" src="/js/OscilloscopeViewer.js"></script>
    <script type="module" src="/js/TopologyMeshViewer.js"></script>
    <script type="module" src="/js/controlDeck.js"></script>
    <script type="module" src="/js/RawMatrixViewer.js"></script>
</head>

<body>
    <div id="tensorMatrixContainer" style="width: 100vw; height: 100vh; position: relative; padding: 20px;"></div>

    <script type="module">
        import { RawMatrixViewer } from '/js/RawMatrixViewer.js';

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('tensorMatrixContainer');
            if (!container) return;

            const viewer = new RawMatrixViewer(container);
            window.matrixViewer = viewer;
            viewer.connect('/ws/telemetry');
        });
    </script>
</body>

</html>
