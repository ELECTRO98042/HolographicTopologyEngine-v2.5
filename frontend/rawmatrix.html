<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic HUD - CH-03 Raw Matrix Inspector</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        html, 
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #050808;
            overflow: hidden;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }
    
        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }
    </style>
    <!-- Core Engine & Viewer Scripts -->
    <script type="module" src="/js/OscilloscopeViewer.js"></script>
    <script type="module" src="/js/TopologyMeshViewer.js"></script>
    <script type="module" src="/js/controlDeck.js"></script>
    <script type="module" src="/js/RawMatrixViewer.js"></script>
</head>
<body>
    <div id="channel-mount" style="width: 100vw; height: 100vh; position: relative;"></div>
    <div class="matrix-header">
        <div>CH-03: TENSOR MATRIX INSPECTOR // INVARIANT LAB</div>
        <div class="controls-toolbar">
            <span>FORMAT:</span>
            <button class="hud-btn" id="formatHexBtn">HEX</button>
            <button class="hud-btn" id="formatFloatBtn">FLOAT32</button>
            <button class="hud-btn" id="formatSciBtn">SCIENTIFIC</button>
        </div>
    </div>

    <div class="matrix-workspace">
        <!-- Sidebar for Analytical Invariants -->
        <div class="diagnostics-sidebar">
            <div class="metric-card">
                <div class="metric-title">Frobenius Norm ($\vert{}A\vert{}_F$)</div>
                <div class="metric-value" id="metricNorm">0.0000</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Matrix Trace</div>
                <div class="metric-value" id="metricTrace">0.0000</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Sparsity Density</div>
                <div class="metric-value" id="metricSparsity">0.0%</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Peak Amplitude [Min / Max]</div>
                <div class="metric-value" id="metricMinMax">0.00 / 0.00</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Spatial Z-Slice Filter</div>
                <input type="range" id="zSlicerRange" min="0" max="31" value="0" style="width: 100%; accent-color: #00ffcc; margin-top: 8px;">
                <div style="font-size: 0.7rem; color: #94a3b8; margin-top: 4px;">Index: <span id="zSliceVal">0</span> / <span id="zSliceMax">31</span></div>
            </div>
        </div>

        <!-- Main Matrix Grid Viewport -->
        <div class="matrix-viewport">
            <table class="matrix-grid" id="matrix-table">
                   <!-- Dynamically populated via RawMatrixViewer.js -->
            </table>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('matrix-table');
            const viewer = new RawMatrixViewer(container, {
                normEl: document.getElementById('metricNorm'),
                traceEl: document.getElementById('metricTrace'),
                sparsityEl: document.getElementById('metricSparsity'),
                minMaxEl: document.getElementById('metricMinMax'),
                zValEl: document.getElementById('zSliceVal')
            });
            window.matrixViewer = viewer
            
            // Set the slider span to ajust the value
            const sliderEl = document.getElementById('zSlicerRange');
            const maxLabelEl = document.getElementById('zSliceMax');
            if (sliderEl) {
                sliderEl.max = totalSlices - 1;
            }
            if (maxLabelEl) {
                maxLabelEl.innerText = totalSlices - 1;
            }

            // WebSocket Connection
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const socket = new WebSocket(`${protocol}//${window.location.host}/ws/telemetry`);
            socket.binaryType = 'arraybuffer';

            socket.onmessage = (event) => {
                if (event.data instanceof ArrayBuffer) {
                    const data = new Float32Array(event.data);
                    viewer.update(data);
                }
            };

            document.getElementById('zSliceRange').addEventListener('input', (e) => {
                viewer.setZSlice(parseInt(e.target.value, 10));
            });

            document.getElementById('formatHexBtn').addEventListener('click', () => viewer.setFormat('hex'));
            document.getElementById('formatFloatBtn').addEventListener('click', () => viewer.setFormat('float'));
            document.getElementById('formatSciBtn').addEventListener('click', () => viewer.setFormat('scientific'));
        });
    </script>
</body>
</html>
