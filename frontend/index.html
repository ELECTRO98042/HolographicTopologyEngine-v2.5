<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <div id="hud-container">
        <h3>HOLOGRAPHIC HUD V2.6</h3>
        <div class="hud-integrity">System Integrity: 100%</div>
        <div class="hud-ee">Entanglement (See): 0.0</div>
        <div class="hud-phi">Integrated Info (Phi): 0.0</div>
    </div>
    <title>Holographic Topology Engine HUD v2.6</title>
    <style>
        body {
            margin: 0;
            background-color: #05050a;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        #hud-container {
            position: absolute;
            top: 20px;
            left: 20px;
            height: auto;
            width: 320px;
            background: rgba(5, 5, 10, 0.85);
            border: 1px solid #00ffcc;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            pointer-events: none;
        }

        h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hud-integrity, .hud-ee, .hud-phi {
            font-size: 14px;
            margin: 5px 0;
        }

        .metric-value {
            color: #ff0055;
            font-weight: bold;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

    <canvas id="hudCanvas"></canvas>

    <script>
        const canvas = document.getElementById('hudCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();
        //Sample simulation nodes
        //1. Initialize nodes with base coordinates for independent wandering/orbiting
        let nodes = [
            { id: "N-001", x: canvas.width * 0.4, y: canvas.height * 0.4, z: 0.28, isCore: true, isSevered: false, health: 1 },
            { id: "N-002", x: canvas.width * 0.6, y: canvas.height * 0.5, z: 0.50, isCore: false, isSevered: false, health: 1 },
            { id: "N-003", x: canvas.width * 0.5, y: canvas.height * 0.7, z: 0.12, isCore: false, isSevered: false, health: 1 }
        ];
        function updateHUD(packet) {
            const integrityEl = document.querySelector('.hud-integrity');
            const eeEl = document.querySelector('.hud-ee');
            const phiEl = document.querySelector('.hud-phi');

            if (integrityEl) integrityEl.textContent = `System Integrity: ${packet.integrity}%`;
            if (eeEl) eeEl.textContent = `Entanglement (See): ${packet.s_ee}`;
            if (phiEl) phiEl.textContent = `Integrated Info (Phi): ${packet.phi}`;
        }
        //let simulationParams = {
        //    resolution: 64,
        //    coupling_constant: 0.1
        //};

        // Establish WebSocket connection early so it's scoped for event listeners
        const wsUrl = "ws://127.0.0.1:8000/ws/telemetry";
        const ws = new WebSocket(wsUrl);
        ws.binaryType = "arraybuffer";

        ws.onopen = () => {
            console.log("Holographic HUD WebSocket Connected.");
            ws.send(JSON.stringify({
                action: "update_nodes",
                nodes: nodes
            }));
        };

        ws.onmessage = function (event) {
            if (event.data instanceof ArrayBuffer) {
                const floatArray = new Float32Array(event.data);
                for (let i = 0; i < nodes.length && (i * 4 + 1) < floatArray.length; i++) {
                    nodes[i].x = floatArray[i * 4];
                    nodes[i].y = floatArray[i * 4 + 1];
                    nodes[i].z = floatArray[i * 4 + 2];
                }
            } else {
                const packet = JSON.parse(event.data);
                if (packet.type === "hud_update") {
                    updateHUD(packet);
                }
            }
        };
        
        ws.onclose = () => {
            console.warn("Holographic HUD WebSocket Disconnected. Reconnecting...");
            setTimeout(() => location.reload(), 3000);
        };
        
    // Render loop
        function draw() {
            ctx.fillStyle = '#05050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid background
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.05)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Connections
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.3)';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    ctx.beginPath();
                    ctx.moveTo(nodes[i].x, nodes[i].y);
                    ctx.lineTo(nodes[j].x, nodes[j].y);
                    ctx.stroke();
                }
            }

        // Nodes
        nodes.forEach(node => {
            ctx.fillStyle = node.isCore ? '#ff0055' : '#00ffcc';
            ctx.beginPath();
            ctx.arc(node.x, node.y, node.isCore ? 6 : 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.font = '10px Courier New';
            ctx.fillText(node.id, node.x + 10, node.y + 4);
        });
    }

    // Start animation loop
    function animationLoop() {
        draw();
        requestAnimationFrame(animationLoop);
    }
    animationLoop();

    // Mouse Drag Interaction
        let selectedNode = null;

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            for (let node of nodes) {
                const dx = node.x - mouseX;
                const dy = node.y - mouseY;
                if (Math.sqrt(dx * dx + dy * dy) < 20) {
                    selectedNode = node;
                    break;
                }
            }
        });

        let lastSendTime = 0;

        canvas.addEventListener('mousemove', (e) => {
                if (!selectedNode) return;
                const rect = canvas.getBoundingClientRect();
                selectedNode.x = e.clientX - rect.left;
                selectedNode.y = e.clientY - rect.top;

                const now = performance.now();
                if (now - lastSendTime > 16) {
                    lastSendTime = now;
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            action: "update_nodes",
                            nodes: nodes.map(n => ({ id: n.id, x: n.x, y: n.y, z: n.z || 0.0 }))
                        }));
                    }
                }
            });

            canvas.addEventListener('mouseup', () => {
                    selectedNode = null;
                });

    </script>
</body>

</html>
