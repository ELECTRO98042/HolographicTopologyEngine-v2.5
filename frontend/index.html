<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Holographic Topology Engine HUD v2.5</title>
    <style>
        body {
            margin: 0;
            background-color: #05050a;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        #hud-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 290px;
            background: rgba(5, 5, 10, 0.85);
            border: 1px solid #00ffcc;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            pointer-events: none;
        }

        h1 {
            font-size: 16px;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .metric-row {
            font-size: 14px;
            margin: 5px 0;
        }

        .metric-value {
            color: #ff0055;
            font-weight: bold;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

    <div id="hud-container">
        <h1>Holographic HUD v2.5</h1>
        <div class="metric-row">System Integrity: <span id="val-integrity" class="metric-value">--</span></div>
        <div class="metric-row">Entanglement ($S_{ee}$): <span id="val-see" class="metric-value">--</span></div>
        <div class="metric-row">Integrated Info ($\Phi$): <span id="val-phi" class="metric-value">--</span></div>
    </div>

    <canvas id="hudCanvas"></canvas>

    <script>
        const canvas = document.getElementById('hudCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Sample simulation nodes
        let nodes = [
            { id: "N-001", x: canvas.width * 0.4, y: canvas.height * 0.4, z: 0.28, isCore: true, isSevered: false, health: 1 },
            { id: "N-002", x: canvas.width * 0.6, y: canvas.height * 0.5, z: 0.50, isCore: false, isSevered: false, health: 1 },
            { id: "N-003", x: canvas.width * 0.5, y: canvas.height * 0.7, z: 0.12, isCore: false, isSevered: false, health: 1 }
        ];

        let simulationParams = {
            resolution: 64,
            coupling_constant: 0.1
        };

        async function sendTelemetry() {
            const payload = {
                version: "1.8.0",
                timestamp: new Date().toISOString(),
                canvas: { width: canvas.width, height: canvas.height },
                nodes: nodes,
                params: simulationParams
            };

            try {
                const response = await fetch('http://127.0.0.1:8000/api/compute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                document.getElementById('val-integrity').innerText = data.integrity;
                document.getElementById('val-see').innerText = data.s_ee;
                document.getElementById('val-phi').innerText = data.phi;
            } catch (err) {
                console.error("Telemetry sync error:", err);
            }
        }

        function updateNodes() {
            // Slight orbital drift for visualization dynamism
            const time = Date.now() * 0.001;
            nodes.forEach((node, i) => {
                node.x += Math.sin(time + i) * 0.5;
                node.y += Math.cos(time + i) * 0.5;
            });
        }

        function draw() {
            ctx.fillStyle = '#05050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw holographic grid background
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.05)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Draw connections between nodes
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.3)';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    ctx.beginPath();
                    ctx.moveTo(nodes[i].x, nodes[i].y);
                    ctx.lineTo(nodes[j].x, nodes[j].y);
                    ctx.stroke();
                }
            }

            // Draw nodes
            nodes.forEach(node => {
                ctx.fillStyle = node.isCore ? '#ff0055' : '#00ffcc';
                ctx.beginPath();
                ctx.arc(node.x, node.y, node.isCore ? 6 : 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.font = '10px Courier New';
                ctx.fillText(node.id, node.x + 10, node.y + 4);
            });
        }

        function loop() {
            updateNodes();
            draw();
            requestAnimationFrame(loop);
        }

        // Poll telemetry every 500ms
        //setInterval(sendTelemetry, 500);

        // Start animation loop
        let selectedNode = null;

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Iterate through nodes to check if click is within selection radius
            for (let node of nodes) {
                const dx = node.x - mouseX;
                const dy = node.y - mouseY;
                if (Math.sqrt(dx * dx + dy * dy) < 20) {
                    selectedNode = node;
                    break;
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!selectedNode) return;

            const rect = canvas.getBoundingClientRect();
            selectedNode.x = e.clientX - rect.left;
            selectedNode.y = e.clientY - rect.top;
        });

        window.addEventListener('mouseup', () => {
                if (selectedNode) {
                    selectedNode = null;

                    // Push updated node coordinates to the backend via WebSocket
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            action: "update_nodes",
                            nodes: nodes
                        }));
                    }
                }
            });
        loop();
        // Establish persistent WebSocket connection to the backend telemetry stream
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = "ws://127.0.0.1:8000/ws/telemetry";
            const ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                    console.log("Holographic HUD WebSocket Connected.");
                    ws.send(JSON.stringify({
                        action: "update_nodes",
                        nodes: nodes
                    }));
                };

            ws.onmessage = (event) => {
                try {
                    const packet = JSON.parse(event.data);

                    if (packet.type === "hud_update") {
                        const integrityEl = document.getElementById("val-integrity");
                        const sEeEl = document.getElementById("val-see");
                        const phiEl = document.getElementById("val-phi");

                        if (integrityEl) integrityEl.innerText = `${packet.integrity}%`;
                        if (sEeEl) sEeEl.innerText = packet.s_ee.toFixed(4);
                        if (phiEl) phiEl.innerText = packet.phi.toFixed(4);
                    }
                } catch (err) {
                    console.error("Failed to parse telemetry packet:", err);
                }
            };

            ws.onclose = () => {
                console.warn("Holographic HUD WebSocket Disconnected. Reconnecting...");
                setTimeout(() => location.reload(), 3000);
            };
    </script>
</body>

</html>
