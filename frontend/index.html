<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <div id="hud-container">
        <h3>HOLOGRAPHIC HUD V2.6</h3>
        <div class="hud-integrity">System Integrity: 100%</div>
        <div class="hud-ee">Entanglement ($S_{ee}$): 0.0</div>
        <div class="hud-phi">Integrated Info ($\Phi$): 0.0</div>
    </div>
    <title>Holographic Topology Engine HUD v2.5</title>
    <style>
        body {
            margin: 0;
            background-color: #05050a;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        #hud-container {
            position: absolute;
            top: 20px;
            left: 20px;
            height: auto;
            width: 320px;
            background: rgba(5, 5, 10, 0.85);
            border: 1px solid #00ffcc;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            pointer-events: none;
        }

        h1 {
            font-size: 16px;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .metric-row {
            font-size: 14px;
            margin: 5px 0;
        }

        .metric-value {
            color: #ff0055;
            font-weight: bold;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

    <canvas id="hudCanvas"></canvas>

    <script>
        const canvas = document.getElementById('hudCanvas');
        const ctx = canvas.getContext('2d');
        
        function updateHUD(packet) {
                const integrityEl = document.querySelector('.hud-integrity');
                const eeEl = document.querySelector('.hud-ee');
                const phiEl = document.querySelector('.hud-phi');

                if (integrityEl) integrityEl.textContent = `System Integrity: ${packet.integrity}%`;
                if (eeEl) eeEl.textContent = `Entanglement ($S_{ee}$): ${packet.s_ee}`;
                if (phiEl) phiEl.textContent = `Integrated Info ($\\Phi$): ${packet.phi}`;
            }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        //Sample simulation nodes
        //1. Initialize nodes with base coordinates for independent wandering/orbiting
        let nodes = [
            { id: "N-001", baseX: 320, baseY: 240, x: 320, y: 240, angle: Math.random() * Math.PI * 2, speed: 0.015, radius: 25, z: 0.28, isCore: true, isSevered: false, health: 1 },
            { id: "N-002", baseX: 480, baseY: 300, x: 480, y: 300, angle: Math.random() * Math.PI * 2, speed: 0.022, radius: 30, z: 0.50, isCore: false, isSevered: false, health: 1 },
            { id: "N-003", baseX: 400, baseY: 420, x: 400, y: 420, angle: Math.random() * Math.PI * 2, speed: 0.018, radius: 20, z: 0.12, isCore: false, isSevered: false, health: 1 }
        ];

        let simulationParams = {
            resolution: 64,
            coupling_constant: 0.1
        };

        async function sendTelemetry() {
            const payload = {
                version: "1.8.0",
                timestamp: new Date().toISOString(),
                canvas: { width: canvas.width, height: canvas.height },
                nodes: nodes,
                params: simulationParams
            };

            try {
                const response = await fetch('http://127.0.0.1:8000/api/compute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                document.getElementById('val-integrity').innerText = data.integrity;
                document.getElementById('val-see').innerText = data.s_ee;
                document.getElementById('val-phi').innerText = data.phi;
            } catch (err) {
                console.error("Telemetry sync error:", err);
            }
        }
        
        // 2. The proper update loop using unique phase offsets per node
        function updateNodes() {
            
            const time = Date.now() * 0.0002; // Slow down time for smoother motion
            nodes.forEach((node, i) => {
                // Each node updates using its own unique speed and phase, 
                // oscillating around its own stable base coordinates.
                node.angle += node.speed * 0.3; // Adjust speed multiplier for smoother motion
                node.x = node.baseX + Math.sin(node.angle + i) * node.radius * 1.5;
                node.y = node.baseY + Math.cos(node.angle * 1.3) * node.radius * 1.5; // asymmetric multiplier prevents rigid shape locking
            });
        }

        function draw() {
            ctx.fillStyle = '#05050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw holographic grid background
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.05)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2; 

            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Draw connections between nodes
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.3)';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    ctx.beginPath();
                    ctx.moveTo(nodes[i].x, nodes[i].y);
                    ctx.lineTo(nodes[j].x, nodes[j].y);
                    ctx.stroke();
                }
            }

            // Draw nodes
            nodes.forEach(node => {
                ctx.fillStyle = node.isCore ? '#ff0055' : '#00ffcc';
                ctx.beginPath();
                ctx.arc(node.x, node.y, node.isCore ? 6 : 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.font = '10px Courier New';
                ctx.fillText(node.id, node.x + 10, node.y + 4);
            });
        }
        class Node {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                // Give each node its own unique, independent velocity vector
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;

                // Alternatively, for independent orbital/wandering motion without rigid locking,
                // assign individual phase offsets or frequencies:
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 0.02 + Math.random() * 0.02;
                this.radiusOffset = 20 + Math.random() * 30;
                this.centerX = x;
                this.centerY = y;
                }

                update(time) {
                    // Option A: True free-form movement / wandering
                    // this.x += this.vx;
                    // this.y += this.vy;

                    // Option B: Independent orbital motion using unique phase/speed offsets
                    this.angle += this.speed;
                    this.x = this.centerX + Math.cos(this.angle) * this.radiusOffset;
                    this.y = this.centerY + Math.sin(this.angle * 1.3) * this.radiusOffset; // asymmetric multiplier prevents rigid shape locking
                }
            }
        

        function updateNodes() {
                const time = Date.now() * 0.0002;
                nodes.forEach((node, i) => {
                    node.angle += node.speed * 0.3;
                    node.x = node.baseX + Math.sin(node.angle + i) * (node.radius * 1.5);
                    node.y = node.baseY + Math.cos(node.angle * 1.3) * (node.radius * 1.5);
                });
            }

        function animationLoop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                // Update node positions independently
                updateNodes();
                // Then draw your grid, connections, and nodes as normal...
                draw();
                requestAnimationFrame(animationLoop);
                // Update each node state independently
                //nodes.forEach((node, index) => {
                //    node.update();

                    // Draw node
                //    ctx.beginPath();
                //    ctx.arc(node.x, node.y, 4, 0, Math.PI * 2);
                //    ctx.fillStyle = '#00ff66';
                //    ctx.fill();

                    // Draw label coordinates
                //    ctx.fillText(`ID-${index}`, node.x + 8, node.y - 8);
                //});

                // Optional: Draw connecting topological lines between the independent nodes
                //ctx.beginPath();
                //ctx.moveTo(nodes[0].x, nodes[0].y);
                //for (let i = 1; i < nodes.length; i++) {
                //    ctx.lineTo(nodes[i].x, nodes[i].y);
                //}
                //ctx.closePath();
                //ctx.strokeStyle = 'rgba(0, 255, 102, 0.4)';
                //ctx.stroke();
            }
            
        requestAnimationFrame(animationLoop);
        // Poll telemetry every 500ms
        //setInterval(sendTelemetry, 500);

        // Start animation loop
        let selectedNode = null;

            canvas.addEventListener('mousedown', (e) => {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                // Check if click is near any node
                for (let node of nodes) {
                    const dx = node.x - mouseX;
                    const dy = node.y - mouseY;
                    if (Math.sqrt(dx * dx + dy * dy) < 15) { // 15px grab radius
                        selectedNode = node;
                        break;
                    }
                }
            });

            let lastSendTime = 0;
                canvas.addEventListener('mousemove', (e) => {
                    if (!selectedNode) return;
                    const rect = canvas.getBoundingClientRect();
                    selectedNode.x = e.clientX - rect.left;
                    selectedNode.y = e.clientY - rect.top;

                    const now = performance.now();
                    if (now - lastSendTime > 16) {
                        lastSendTime = now;
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({
                                action: "update_nodes",
                                nodes: nodes.map(n => ({ id: n.id, x: n.x, y: n.y }))
                            }));
                        }
                    }
                });

            canvas.addEventListener('mouseup', () => {
                selectedNode = null;
            });
        // Start the animation loop    
        loop();
        // Establish persistent WebSocket connection to the backend telemetry stream
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = "ws://127.0.0.1:8000/ws/telemetry";
            const ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                    console.log("Holographic HUD WebSocket Connected.");
                    ws.send(JSON.stringify({
                        action: "update_nodes",
                        nodes: nodes
                    }));
                };

            ws.binaryType = "arraybuffer";

                ws.onmessage = function (event) {
                        if (event.data instanceof ArrayBuffer) {
                            const floatArray = new Float32Array(event.data);
                            // Each node takes 4 floats: x, y, z, pad
                            for (let i = 0; i < nodes.length && (i * 4 + 1) < floatArray.length; i++) {
                                nodes[i].x = floatArray[i * 4];
                                nodes[i].y = floatArray[i * 4 + 1];
                                nodes[i].z = floatArray[i * 4 + 2];
                            }
                        } else {
                            const packet = JSON.parse(event.data);
                            if (packet.type === "hud_update") {
                                updateHUD(packet);
                            }
                        }
                    };

            ws.onclose = () => {
                console.warn("Holographic HUD WebSocket Disconnected. Reconnecting...");
                setTimeout(() => location.reload(), 3000);
            };
    </script>
</body>

</html>
