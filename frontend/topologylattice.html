<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic HUD - CH-02 Topology Lattice</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #050808;
            overflow: hidden;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }
    
        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }
    </style>
    <!-- Core Engine & Viewer Scripts -->
    <script type="module" src="/js/controlDeck.js"></script>
    <script type="module" src="/js/TopologyMeshViewer.js"></script>
</head>

<body>
    <div id="channel-mount" style="width: 100vw; height: 100vh; position: relative;"></div>
    <div id="lattice-container"></div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const mount = document.getElementById('channel-mount');
            if (mount && window.TopologyMeshViewer) {
                const viewer = new TopologyMeshViewer(mount);
                viewer.connect('/ws/telemetry');
            }
        });
    </script>
</body>

</html>
